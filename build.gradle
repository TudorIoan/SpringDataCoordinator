// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlinVersion = '2.1.0'
    ext.hiltVersion = '2.53'
    ext.navigationVersion = '2.7.7'
    ext.compileSdkVersion = 35
    ext.targetSdkVersion = 35
    ext.minSdkVersion = 28
    ext.playServicesVersion = '16.0.0'
    ext.kotlinCoroutinesVersion = '1.7.3'
    ext.appCompatVersion = '1.2.0'
    ext.constraintLayoutVersion = '2.0.4'
    ext.legacySupportVersion = '1.0.0'
    ext.multidex_version = '2.0.1'
    ext.googleServices = '4.4.0'
    ext.salesforcePushVersion = '8.0.7'
    ext.firebaseCrashlyticsVersion = '2.9.4'

    repositories {
        google()
        jcenter()
        
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hiltVersion"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath "com.google.gms:google-services:$googleServices"
        classpath "com.google.firebase:firebase-crashlytics-gradle:$firebaseCrashlyticsVersion"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlinVersion"
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
